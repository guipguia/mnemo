version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /ui
    schedule: {interval: weekly}
    groups:
      ui: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    ignore:
      # Node majors move together in the Dockerfile, CI, and the release workflow, and only
      # to LTS (even) versions, so they're done by hand. Digest and patch updates still come.
      - dependency-name: node
        update-types: [version-update:semver-major]
