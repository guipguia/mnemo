{{- if and (include "mnemo.hasHub" .) .Values.hub.agentListener.enabled }}
{{- $svc := .Values.hub.agentListener.service }}
# Agents' mutual TLS port: TLS goes end to end, so no ingress (it would terminate it).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mnemo.fullname" . }}-agents
  labels:
    {{- include "mnemo.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
spec:
  type: {{ $svc.type }}
  selector: {{- include "mnemo.selector" . | nindent 4 }}
  ports:
    - name: agents
      port: {{ $svc.port }}
      targetPort: agents
{{- end }}
