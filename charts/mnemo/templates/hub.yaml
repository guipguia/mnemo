{{- if include "mnemo.hasHub" . }}
{{- if not .Values.hub.database.existingSecret }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mnemo.fullname" . }}
  labels: {{- include "mnemo.labels" . | nindent 4 }}
  {{- if .Values.hub.persistence.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: [ReadWriteOnce]  # block storage only: SQLite locking is unreliable on NFS
  {{- with .Values.hub.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.hub.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mnemo.fullname" . }}
  labels: {{- include "mnemo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.hub.service.type }}
  selector: {{- include "mnemo.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.hub.service.port }}
      targetPort: http
      {{- if and (eq .Values.hub.service.type "NodePort") .Values.hub.service.nodePort }}
      nodePort: {{ .Values.hub.service.nodePort }}
      {{- end }}
{{- if .Values.hub.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mnemo.fullname" . }}-metrics
  labels:
    {{- include "mnemo.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector: {{- include "mnemo.selector" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
{{- end }}
{{- if and .Values.hub.metrics.enabled .Values.hub.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mnemo.fullname" . }}
  labels:
    {{- include "mnemo.labels" . | nindent 4 }}
    {{- with .Values.hub.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mnemo.selector" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
{{- end }}
{{- if ne .Values.hub.auth.mode "none" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mnemo.fullname" . }}-policy
  labels: {{- include "mnemo.labels" . | nindent 4 }}
data:
  policy.yaml: |
    {{- toYaml .Values.hub.auth.policy | nindent 4 }}
{{- end }}
{{- if .Values.hub.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mnemo.fullname" . }}
  labels: {{- include "mnemo.labels" . | nindent 4 }}
  {{- with .Values.hub.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.hub.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.hub.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.hub.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mnemo.fullname" . }}
                port: {name: http}
{{- end }}
{{- end }}
{{- if and (include "mnemo.hasHub" .) .Values.hub.backup.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mnemo.fullname" . }}-litestream
  labels: {{- include "mnemo.labels" . | nindent 4 }}
data:
  litestream.yml: |
    dbs:
      - path: /data/mnemo.db
        replica:
          url: {{ .Values.hub.backup.url | quote }}
{{- end }}
