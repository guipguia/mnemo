# all:   hub + agent in one pod. Single cluster, simplest install.
# hub:   the central hub only (storage, API, UI). Agents in other clusters push to it.
# agent: watch this cluster and push to a hub elsewhere.
mode: all

image:
  repository: ghcr.io/guipguia/mnemo
  tag: ""  # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# Shared secret between agents and the hub. For multi-cluster, create one Secret with key
# "token" in every cluster and set existingSecret, so all agents and the hub agree.
# Otherwise the chart generates a token and keeps it across upgrades.
token:
  existingSecret: ""

agent:
  # Name shown in mnemo for this cluster. Required in modes all and agent.
  cluster: ""
  # Hub URL, mode agent only. e.g. https://mnemo.example.com, or with mTLS the hub's
  # agent listener: https://mnemo-agents.example.com:8444
  hubURL: ""
  # Mutual TLS to the hub's agent listener (hub.agentListener). A Secret with tls.crt and
  # tls.key (this agent's client certificate, naming agent.cluster as its common name or a
  # DNS name) and ca.crt (the CA to trust for the hub). cert-manager writes all three.
  tls:
    secret: ""
  # What to watch, as group/version/resource ("v1/configmaps" for the core group).
  # The agent's read-only ClusterRole is generated from this list. Secrets are refused.
  watch:
    - apps/v1/deployments
    - apps/v1/statefulsets
    - apps/v1/daemonsets
    - v1/configmaps
    - v1/services
    - v1/serviceaccounts
    - networking.k8s.io/v1/ingresses
    - rbac.authorization.k8s.io/v1/roles
    - rbac.authorization.k8s.io/v1/rolebindings
    - rbac.authorization.k8s.io/v1/clusterroles
    - rbac.authorization.k8s.io/v1/clusterrolebindings
    # Kubernetes Events, archived past their ~1h lifetime and shown on object timelines.
    - v1/events
    # GitOps apps: uncomment the ones installed here to link GitOps changes to the Git
    # revision that made them (the CRDs must exist, or the agent keeps retrying).
    # - argoproj.io/v1alpha1/applications
    # - kustomize.toolkit.fluxcd.io/v1/kustomizations
  # Who made each change, from the API server's audit webhook. Needs API server flags,
  # so self-managed clusters only. See docs/audit.md.
  audit:
    enabled: false
    # Required: Secret with key "token", the bearer token in the API server's webhook config.
    existingSecret: ""
    # Required: kubernetes.io/tls Secret for the webhook, valid for the address the API
    # server uses (the clusterIP below, or a node address with a NodePort).
    tlsSecret: ""
    service:
      # The API server resolves names with the node's DNS, not cluster DNS: give the
      # Service a fixed clusterIP and use it in the webhook config, or use a NodePort.
      type: ClusterIP
      clusterIP: ""
      port: 8443
      nodePort: null

hub:
  # Take agent pushes only over mutual TLS, on port 8444 of a separate Service
  # (<release>-agents); the main port then refuses them. See docs/mtls.md.
  agentListener:
    enabled: false
    # Required: a Secret with tls.crt and tls.key (the hub's certificate, valid for the
    # address agents use) and ca.crt (the CA that signs agent client certificates).
    tlsSecret: ""
    service:
      type: LoadBalancer  # agents in other clusters must reach it
      port: 8444
  # PostgreSQL instead of SQLite on a volume: name a Secret with key "url", a
  # postgres://user:password@host:5432/db?sslmode=verify-full URL. Then no PVC is created and
  # hub.persistence and hub.backup don't apply (back up the database your usual way).
  # Allows hub.replicas > 1. See docs/postgres.md.
  database:
    existingSecret: ""
  # Hubs to run, with hub.database (PostgreSQL) in mode hub only. They share the database
  # and elect a leader for webhooks and retention. See docs/postgres.md.
  replicas: 1
  persistence:
    size: 5Gi
    storageClass: ""
    # Keep the history volume on `helm uninstall`. Delete the PVC by hand to drop history.
    keepOnUninstall: true
  # Each object's current state is always kept; older versions expire. 0 disables a limit.
  retention:
    days: 0
    versions: 0
    # Archived Kubernetes Events, by when they were last seen. 0 keeps them forever.
    eventDays: 30
  # Outbound webhooks on matching changes. Name of a Secret with key "webhooks.yaml"
  # (it holds receiver URLs and HMAC secrets); empty disables. See docs/webhooks.md.
  # The hub reads it at startup: restart the pod after changing it.
  webhooks:
    secret: ""
  # Continuous SQLite backup with Litestream (https://litestream.io), run as a sidecar.
  # On an empty volume (new cluster, lost PVC), the hub restores from the replica first.
  backup:
    enabled: false
    # Required: where to replicate, e.g. s3://bucket/mnemo, gs://bucket/mnemo,
    # abs://container@account/mnemo, sftp://user@host/path. S3-compatible stores take
    # ?endpoint=https://minio.example.com in the URL.
    url: ""
    # Secret whose keys become the sidecar's environment: AWS_ACCESS_KEY_ID and
    # AWS_SECRET_ACCESS_KEY, GOOGLE_APPLICATION_CREDENTIALS, LITESTREAM_AZURE_ACCOUNT_KEY, ...
    # Leave empty with workload identity (IRSA, GKE Workload Identity).
    existingSecret: ""
    image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
    resources: {}
  # Prometheus metrics on port 9090, behind their own ClusterIP Service (<release>-metrics),
  # never the hub's: they skip the access policy. Hub and all modes only. See docs/metrics.md.
  metrics:
    enabled: false
    # Create a Prometheus Operator ServiceMonitor for it.
    serviceMonitor:
      enabled: false
      # e.g. {release: kube-prometheus-stack}: the label your Prometheus selects ServiceMonitors by.
      labels: {}
  service:
    type: ClusterIP
    port: 80
    nodePort: null
  ingress:
    enabled: false
    className: ""
    host: mnemo.example.com
    annotations: {}
    tls: []
  # Login and access for the UI/API. See docs/auth.md.
  auth:
    mode: none  # none | oidc | proxy
    # Required with oidc/proxy, e.g.
    # policy:
    #   rules:
    #   - groups: [sre]
    #   - groups: [team-shop]
    #     clusters: [prod]
    #     namespaces: [shop]
    #   rbac: {}  # also grant what each cluster's recorded Kubernetes RBAC does
    policy: {}
    oidc:
      issuer: ""
      clientID: ""
      redirectURL: ""  # https://<host>/auth/callback
      scopes: openid,email,profile
      usernameClaim: email
      groupsClaim: groups
      # Secret with keys client-secret and session-key (32+ random bytes).
      existingSecret: ""
    proxy:
      trustedCIDRs: ""  # required: where the auth proxy connects from
      userHeader: X-Forwarded-User
      groupsHeader: X-Forwarded-Groups

extraArgs: []
# Extra container environment, e.g. OpenTelemetry tracing (docs/tracing.md):
# - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring:4318"}
extraEnv: []
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 512Mi}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
