# all:   hub + agent in one pod. Single cluster, simplest install.
# hub:   the central hub only (storage, API, UI). Agents in other clusters push to it.
# agent: watch this cluster and push to a hub elsewhere.
mode: all

image:
  repository: ghcr.io/guipguia/mnemo
  tag: ""  # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# Shared secret between agents and the hub. For multi-cluster, create one Secret with key
# "token" in every cluster and set existingSecret, so all agents and the hub agree.
# Otherwise the chart generates a token and keeps it across upgrades.
token:
  existingSecret: ""

agent:
  # Name shown in mnemo for this cluster. Required in modes all and agent.
  cluster: ""
  # Hub URL, mode agent only. e.g. https://mnemo.example.com
  hubURL: ""
  # What to watch, as group/version/resource ("v1/configmaps" for the core group).
  # The agent's read-only ClusterRole is generated from this list. Secrets are refused.
  watch:
    - apps/v1/deployments
    - apps/v1/statefulsets
    - apps/v1/daemonsets
    - v1/configmaps
    - v1/services
    - v1/serviceaccounts
    - networking.k8s.io/v1/ingresses
    - rbac.authorization.k8s.io/v1/roles
    - rbac.authorization.k8s.io/v1/rolebindings
    - rbac.authorization.k8s.io/v1/clusterroles
    - rbac.authorization.k8s.io/v1/clusterrolebindings
    # Kubernetes Events, archived past their ~1h lifetime and shown on object timelines.
    - v1/events
  # Who made each change, from the API server's audit webhook. Needs API server flags,
  # so self-managed clusters only. See docs/audit.md.
  audit:
    enabled: false
    # Required: Secret with key "token", the bearer token in the API server's webhook config.
    existingSecret: ""
    # Required: kubernetes.io/tls Secret for the webhook, valid for the address the API
    # server uses (the clusterIP below, or a node address with a NodePort).
    tlsSecret: ""
    service:
      # The API server resolves names with the node's DNS, not cluster DNS: give the
      # Service a fixed clusterIP and use it in the webhook config, or use a NodePort.
      type: ClusterIP
      clusterIP: ""
      port: 8443
      nodePort: null

hub:
  persistence:
    size: 5Gi
    storageClass: ""
    # Keep the history volume on `helm uninstall`. Delete the PVC by hand to drop history.
    keepOnUninstall: true
  # Each object's current state is always kept; older versions expire. 0 disables a limit.
  retention:
    days: 0
    versions: 0
    # Archived Kubernetes Events, by when they were last seen. 0 keeps them forever.
    eventDays: 30
  # Outbound webhooks on matching changes. Name of a Secret with key "webhooks.yaml"
  # (it holds receiver URLs and HMAC secrets); empty disables. See docs/webhooks.md.
  # The hub reads it at startup: restart the pod after changing it.
  webhooks:
    secret: ""
  service:
    type: ClusterIP
    port: 80
    nodePort: null
  ingress:
    enabled: false
    className: ""
    host: mnemo.example.com
    annotations: {}
    tls: []
  # Login and access for the UI/API. See docs/auth.md.
  auth:
    mode: none  # none | oidc | proxy
    # Required with oidc/proxy, e.g.
    # policy:
    #   rules:
    #   - groups: [sre]
    #   - groups: [team-shop]
    #     clusters: [prod]
    #     namespaces: [shop]
    policy: {}
    oidc:
      issuer: ""
      clientID: ""
      redirectURL: ""  # https://<host>/auth/callback
      scopes: openid,email,profile
      usernameClaim: email
      groupsClaim: groups
      # Secret with keys client-secret and session-key (32+ random bytes).
      existingSecret: ""
    proxy:
      trustedCIDRs: ""  # required: where the auth proxy connects from
      userHeader: X-Forwarded-User
      groupsHeader: X-Forwarded-Groups

extraArgs: []
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 512Mi}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
